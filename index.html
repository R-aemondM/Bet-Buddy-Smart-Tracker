<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bet Buddy</title>
    <meta name="description" content="Bet before you bet" />
    <meta property="og:title" content="Bet Buddy" />
    <meta property="og:description" content="Bet before you bet" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bet Buddy" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--bg-background)',
              surface: 'var(--bg-surface)',
              primary: '#3b82f6', // blue-500
              success: '#10b981', // emerald-500
              danger: '#ef4444', // red-500
              warning: '#f59e0b', // amber-500
              
              // Semantic Colors for Theming
              textMain: 'var(--text-main)',
              textMuted: 'var(--text-muted)',
              borderBase: 'var(--border-base)',
              inputBg: 'var(--input-bg)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Light Mode Defaults */
        --bg-background: #f1f5f9; /* slate-100 */
        --bg-surface: #ffffff;    /* white */
        --text-main: #0f172a;     /* slate-900 */
        --text-muted: #64748b;    /* slate-500 */
        --border-base: #e2e8f0;   /* slate-200 */
        --input-bg: #f8fafc;      /* slate-50 */
      }

      .dark {
        /* Dark Mode Defaults */
        --bg-background: #0f172a; /* slate-900 */
        --bg-surface: #1e293b;    /* slate-800 */
        --text-main: #f8fafc;     /* slate-50 */
        --text-muted: #94a3b8;    /* slate-400 */
        --border-base: #334155;   /* slate-700 */
        --input-bg: #0f172a;      /* slate-900 */
      }

      body {
        background-color: var(--bg-background);
        color: var(--text-main);
        transition: background-color 0.3s, color 0.3s;
      }
      
      /* Custom Scrollbar for sleek look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-surface);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--text-muted);
        border-radius: 4px;
        opacity: 0.5;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* Remove Number Input Spinners/Sliders */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.log('SW registration skipped:', err);
        });
      });
    }
  </script>
</body>
</html>
